name: CD

# On every merge to master: build the image and push it to GitHub Container Registry.
on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write # to push to ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          # The commit goes into the image, so training logs which code it ran.
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
