name: CI

on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Preprocess the sample
        run: uv run python scripts/preprocess.py --input tests/data/listings_sample.csv --output data/processed/sample.csv

      - name: Build features on the sample
        run: uv run python scripts/features.py --input data/processed/sample.csv --landmarks tests/data/landmarks.csv --output data/features/sample.csv
